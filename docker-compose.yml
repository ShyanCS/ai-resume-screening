name: hiresense

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hiresense
      POSTGRES_USER: hiresense
      POSTGRES_PASSWORD: hiresense
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiresense -d hiresense"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: hiresense
      MINIO_ROOT_PASSWORD: hiresense-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        sleep 3;
        mc alias set local http://minio:9000 hiresense hiresense-secret;
        mc mb -p local/resumes 2>/dev/null || true;
        exit 0"

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  api:
    build: ./apps/api
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hiresense
      SPRING_DATASOURCE_USERNAME: hiresense
      SPRING_DATASOURCE_PASSWORD: hiresense
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build: ./apps/web
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
