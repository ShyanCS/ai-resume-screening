name: Nightly security audit

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owasp-dependency-check:
    name: OWASP dependency check (maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compute NVD cache week key
        id: nvd-week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache dependency-check NVD data (weekly rollover, incremental updates)
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-nvd-${{ runner.os }}-${{ steps.nvd-week.outputs.week }}
          restore-keys: |
            dependency-check-nvd-${{ runner.os }}-

      - name: Run dependency-check
        working-directory: apps/api
        run: >-
          ./mvnw -B org.owasp:dependency-check-maven:check
          "-DnvdApiKey=${{ secrets.NVD_API_KEY }}"
          "-DfailBuildOnCVSS=9"

  npm-audit:
    name: npm audit (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Audit production dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high --omit=dev
