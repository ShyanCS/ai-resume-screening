spring:
  application:
    name: hiresense-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/hiresense}
    username: ${SPRING_DATASOURCE_USERNAME:hiresense}
    password: ${SPRING_DATASOURCE_PASSWORD:hiresense}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  jwt:
    access-ttl-seconds: 900
  auth:
    refresh-ttl-days: 30
    email-verification-ttl-hours: 24
    password-reset-ttl-minutes: 30
  storage:
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${APP_STORAGE_ACCESS_KEY:hiresense}
    secret-key: ${APP_STORAGE_SECRET_KEY:hiresense-secret}
    bucket: ${APP_STORAGE_BUCKET:resumes}
server:
  port: 8080
management:
  endpoints:
    web:
      exposure:
        include: health,info
